[project]
name = "hr-agent"
version = "0.1.0"
description = "Агент кадровой поддержки сотрудников"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.3.17,<2",
    "langgraph>=1.2.11,<2",
    "pydantic>=2.13,<3",
    "langchain-gigachat>=0.5.1,<0.6",
    "fastapi>=0.120",
    "uvicorn[standard]>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.4",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hr_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff >= 0.16 форматирует python-блоки в markdown; ARCHITECTURE.md трогать не нужно
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "ANN",      # обязательные аннотации типов
    "RUF",
]
ignore = [
    "ANN401",   # Any допустим в **kwargs тулзов
    # проект русскоязычный: кириллица в строках, докстрингах и комментариях — норма
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -m 'not live'"
asyncio_mode = "auto"
markers = ["live: сценарии на живой GigaChat; по умолчанию исключены, запуск: pytest -m live"]
